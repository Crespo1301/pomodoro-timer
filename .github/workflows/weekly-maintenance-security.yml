name: Weekly Maintenance and Security

on:
  schedule:
    - cron: "50 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python app
        run: python -m py_compile pomodoro.py

      - name: Secret scan
        run: |
          set -euo pipefail
          grep -RIn "AKIA\\|BEGIN .*PRIVATE KEY\\|SUPABASE_SERVICE_ROLE\\|STRIPE_SECRET\\|RESEND_API_KEY" . \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=__pycache__ \
            --exclude=data/sessions.json \
            --exclude=.mcp.json \
            --exclude=.env.ai.local \
            && exit 1 || exit 0
